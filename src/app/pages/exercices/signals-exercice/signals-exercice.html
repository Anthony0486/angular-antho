<section>
    <div class="card bg-base-300 shadow-xl w-50 items-center">   
  <h1 class="card-title">Pannier</h1>
  <div class="card-body space-y-4  items-center">
  <p class="text-base">Quantité : <span class="badge badge-info">{{ count() }}</span></p>
  <button (click)="increment()" class="btn btn-circle btn-primary">+1</button>
  <button [disabled]="count() === 0" (click)="decrement()" class="btn btn-circle btn-error">-1</button>
  <button (click)="reset()" class="btn btn-success">Reset</button>
  </div>
  </div>
</section>
