<div class="container">
  <h2>Profil Utilisateur</h2>

  <!--  Liaison bidirectionnelle sur le nom -->
  <div class="form-group">
    <label for="name">Nom :</label>
    <input id="name" type="text" [(ngModel)]="username" placeholder="Entrez votre nom" />
  </div>

  <!--  Liaison bidirectionnelle sur l'email -->
  <div class="form-group">
    <label for="email">Email :</label>
    <input id="email" type="email" [(ngModel)]="usermail" placeholder="Entrez votre mail" />
  </div>

  <hr />

  <!-- Visualisation en temps réel -->
  <div class="preview">
    <h3>Aperçu en direct :</h3>
    <p><strong>Nom :</strong> {{ username }}</p>
    <p><strong>Email :</strong> {{ usermail }}</p>
  </div>
</div>
